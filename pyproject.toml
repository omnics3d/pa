[project]
name = "zatar_pa"
version = "0.3.4-32"
description = "Аналитическая платформа для работы с данными в Termux-Android"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [ "PySide6", "colorlog", "concurrent-log-handler", "python-json-logger",]
[[project.authors]]
name = "Zatar"

[project.scripts]
pa = "main:main"

[tool.setuptools]
packages = [ "core", "utils", "tasks",]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
