# =============================================================================
# КОНФИГУРАЦИЯ ПРОЕКТА ZATAR PA (v2026)
# Этот файл заменяет setup.py и является стандартом сборки в 2026 году.
# Все строки ограничены лимитом в 79 символов для удобства чтения в Termux.
# =============================================================================

[project]
# Техническое имя проекта. Используется для управления пакетом через pip.
name = "zatar_pa"

# Версия: MAJOR.MINOR.PATCH.BUILD
# Обновляется автоматически при каждом коммите скриптом bump_version.py.
version = "0.3.2.3"

# Краткое описание для отображения в интерфейсе GitHub и менеджерах пакетов.
description = "Аналитическая платформа для работы с данными в Termux-Android"

# Сведения об авторе. Необходимы для официальной сборки дистрибутива.
authors = [
    {name = "Zatar"}
]

# Ссылка на файл с документацией. GitHub отобразит его на главной странице.
readme = "README.md"

# Минимум Python 3.11: требуется для встроенного модуля tomllib (чтение TOML).
# Также обеспечивает высокую скорость работы f-строк и аннотаций типов.
requires-python = ">=3.11"

# Список ВНЕШНИХ библиотек. Мы отказались от Pydantic, Pandas и Matplotlib
# для облегчения проекта и ускорения работы на мобильных процессорах.
dependencies = [
    "PySide6",                 # GUI фреймворк для отрисовки графиков в X11
    "colorlog",                # Поддержка цветовой индикации уровней в логах
    "concurrent-log-handler",  # Защита лог-файлов при одновременном доступе
    "python-json-logger",      # Генерация логов в формате JSON для аналитики
]

[project.scripts]
# Позволяет запускать проект командой 'pa' вместо 'python main.py'.
pa = "main:main"

[tool.setuptools]
# Явное перечисление папок-модулей. Гарантирует, что импорты вида
# 'from core.logger...' будут работать корректно после установки.
packages = [
    "core",
    "utils",
    "tasks"
]

[tool.mypy]
# Настройки статической проверки типов. Помогают избежать ошибок Indentation
# и несоответствия типов данных (критично для твоего ExchangeDataManager).
python_version = "3.11"
strict = true                   # Запрещает функции без аннотаций типов
ignore_missing_imports = true   # Скрывает ошибки типов внешних библиотек

# =============================================================================
# ИНСТРУКЦИЯ: После добавления новых библиотек в блок 'dependencies'
# выполните команду: pip install -e .
# =============================================================================

